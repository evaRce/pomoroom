events {}

http {
  server {
    listen 7443 ssl;

    ssl_certificate     /etc/letsencrypt/live/pomoroom-tfm-eva.polandcentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pomoroom-tfm-eva.polandcentral.cloudapp.azure.com/privkey.pem;

    location / {
      proxy_pass http://127.0.0.1:7880;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
